plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the repositories required by Minecraft and Fabric.
    maven { url = uri('../.dependency-cache') }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.zaxxer:HikariCP:${project.hikari_version}"
    include "com.zaxxer:HikariCP:${project.hikari_version}"

    implementation "com.mysql:mysql-connector-j:${project.mysql_connector_version}"
    include "com.mysql:mysql-connector-j:${project.mysql_connector_version}"

    implementation "com.h2database:h2:${project.h2_version}"
    include "com.h2database:h2:${project.h2_version}"

    implementation "org.flywaydb:flyway-core:${project.flyway_version}"
    include "org.flywaydb:flyway-core:${project.flyway_version}"
    implementation "org.flywaydb:flyway-mysql:${project.flyway_version}"
    include "org.flywaydb:flyway-mysql:${project.flyway_version}"
}

def itemPack = tasks.register('itemResourcePack', Zip) {
    archiveFileName = "CSU-YSU-items-${project.mod_version}-resource-pack.zip"
    destinationDirectory = layout.buildDirectory.dir('libs')
    from('src/main/resources') { include 'assets/contribution/**', 'assets/minecraft/textures/trims/entity/wings/**' }
    from('src/itemResourcePack') { include 'pack.mcmeta' }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    dependsOn itemPack
    from(itemPack) { into 'contribution-packs'; rename { 'items-resource-pack.zip' } }
    inputs.property 'version', project.version
    from('src/main/resources/db/migration') {
        include 'V*.sql'
        into 'db/migration/mysql'
    }
    from('src/main/resources/db/migration') {
        include 'V*.sql'
        exclude 'V4__transaction_archive.sql'
        into 'db/migration/h2'
    }
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

def formatterJar = file('../.test-tools/google-java-format-1.37.0-all-deps.jar')
['formatJava': ['--replace'], 'verifyJavaStyle': ['--dry-run', '--set-exit-if-changed']].each { taskName, flags ->
    tasks.register(taskName, JavaExec) {
        classpath = files(formatterJar)
        mainClass = 'com.google.googlejavaformat.java.Main'
        ['api', 'file', 'parser', 'tree', 'util', 'code'].each { packageName ->
            jvmArgs "--add-exports=jdk.compiler/com.sun.tools.javac.${packageName}=ALL-UNNAMED"
        }
        args '--aosp'
        args flags
        doFirst {
            if (!formatterJar.exists()) throw new GradleException('Run tools/setup-formatter.ps1 first')
            args fileTree('src').matching { include '**/*.java' }.files.sort().collect { it.absolutePath }
        }
    }
}
['exportCommandReference': [], 'verifyDocumentation': ['verify']].each { taskName, arguments ->
    tasks.register(taskName, JavaExec) {
        dependsOn tasks.testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'cn.contribution.docs.CommandReferenceChecks'
        args arguments
    }
}
tasks.check.dependsOn tasks.verifyJavaStyle, tasks.verifyDocumentation

