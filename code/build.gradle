// Launch the distributable JAR, with its nested database libraries instead of development output.
tasks.register('verifyPackagedServer', JavaExec) {
    dependsOn tasks.jar
    classpath = sourceSets.main.runtimeClasspath.filter { file ->
        file.isFile() && !['HikariCP-', 'mysql-connector-j-', 'h2-', 'flyway-', 'protobuf-', 'jackson-', 'lombok-'].any { file.name.startsWith(it) }
    }
    mainClass = 'net.fabricmc.loader.impl.launch.knot.KnotServer'
    workingDir = file(project.findProperty('validationDir') ?: 'run')
    standardInput = System.in
    args 'nogui'
    doFirst {
        def api = configurations.runtimeClasspath.files.find { it.name.startsWith('fabric-api-0.') }
        systemProperty 'fabric.addMods', tasks.jar.archiveFile.get().asFile.absolutePath + File.pathSeparator + api.absolutePath
        systemProperty 'fabric.development', 'false'
    }
}

tasks.check.dependsOn tasks.verifyAccountQueries, tasks.verifyDistanceAccounting,
        tasks.verifyEmbeddedAccounts, tasks.verifyEmbeddedStatistics, tasks.verifyEmbeddedPersistence,
        tasks.verifyEmbeddedStocks,
        tasks.verifyConfigCompatibility

