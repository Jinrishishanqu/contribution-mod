# 单只股票在不同繁荣度修正参数下的走势配置。
# 本文件不包含、也不需要任何繁荣度排名。

simulation:
  days: 1000                 # 每个随机种子模拟的游戏日数量
  random_seed: 20260924     # 第一个子图使用的随机种子 seed
  seed_grid_rows: 4         # 随机种子子图网格行数
  seed_grid_columns: 4      # 随机种子子图网格列数；默认共生成 4×4=16 个子图

stock:
  industry: 矿冶            # 股票所属行业，仅用于标题和结果信息
  name: 钻石                # 股票显示名称

# 每个数值生成一条曲线；所有曲线共用同一初始股价和同一条 OU 噪声。
prosperity_corrections:
  - -0.24                  # 最低 w，曲线固定为红色
  - -0.18                  # 负向修正参数
  - -0.12                  # 负向修正参数
  - -0.06                  # 负向修正参数
  - 0.00                   # 无繁荣度修正，曲线固定为蓝色
  - 0.06                   # 正向修正参数
  - 0.12                   # 正向修正参数
  - 0.18                   # 正向修正参数
  - 0.24                   # 最高 w，曲线固定为绿色

ou:
  theta: 0.18              # OU 均值回归速度
  mu: 0.0                  # OU 长期均值
  sigma: 1.25              # OU 随机波动强度
  dt: 1.0                  # OU 单次更新时间步长
  initial_sigma: 1.25      # OU 初始值相对 mu 的标准差

price:
  initial_price_min: 600.0       # 随机初始股价下限（包含）
  initial_price_max: 5000.0      # 随机初始股价上限（包含）
  initial_b_price_ratio: 0.10    # 初始基准 B = 初始股价 × 此比例
  b_target_price_ratio: 0.10     # B 的每日 EMA 目标 = 当日股价 × 此比例
  b_ema_beta: 0.90               # 基准 B 的 EMA beta
  change_coefficient: 0.10       # 股价更新公式中 N×B 前的系数
  daily_floor_ratio: 0.30        # 新股价相对旧股价的单日最低倍数
  daily_ceiling_ratio: 3.00      # 新股价相对旧股价的单日最高倍数

delisting:
  initial_price_ratio: 0.30      # 跌至初始股价此比例时达到退市标准
  historical_high_ratio: 0.15   # 跌至历史最高价此比例时达到退市标准

output:
  base_dir: output/single_stock  # 时间戳结果目录的父目录
  dpi: 170                       # PNG 输出分辨率
